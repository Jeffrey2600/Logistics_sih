# Render free tier. The dashboard is served by the same process as the API,
# so this is the only service the project needs.
services:
  - type: web
    name: ner-logistics
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
